[package]
name = "flux-setup"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
tao = "0.34"
wry = "0.53"
ureq = "2"
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
