[package]
name = "flux-host"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
igd-next = "0.18"
openh264 = "0.9.10"
windows-capture = "2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
